worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 55m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream srghtalk_backend {
        # SockJS fallback requests must keep reaching the same node.
        hash "$remote_addr|$http_user_agent" consistent;
        server 192.168.205.119:3022 max_fails=3 fail_timeout=10s;
        server 192.168.1.77:3022 max_fails=3 fail_timeout=10s;
        server 192.168.1.78:3022 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 3021;
        server_name _;

        location ^~ /actuator/ {
            return 404;
        }

        location / {
            proxy_pass http://srghtalk_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-SRGH-Upstream $upstream_addr always;
        }
    }
}
