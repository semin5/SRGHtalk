spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: SRGHtalk
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    url: jdbc:mysql://localhost:3306/SRGHtalk?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: semin5
    password: omh10ak.
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  address: 0.0.0.0
  port: 3021
  error:
    whitelabel:
      enabled: false

app:
  redis:
    enabled: ${REDIS_ENABLED:true}
    event-channel: ${REDIS_EVENT_CHANNEL:srghtalk:realtime}
    presence-timeout-seconds: ${REDIS_PRESENCE_TIMEOUT_SECONDS:90}
  demo-data:
    enabled: true
  cors:
    allowed-origin-patterns: "*"
  auth:
    token-hours: 24
  storage:
    max-size-bytes: 52428800
    legacy-directory: ${LEGACY_UPLOAD_DIRECTORY:uploads}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:srghtalk}
      secret-key: ${MINIO_SECRET_KEY:srghtalk-minio-change-me}
      bucket: ${MINIO_BUCKET:srghtalk-files}
